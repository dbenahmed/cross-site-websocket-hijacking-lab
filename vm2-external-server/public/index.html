<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cross-Origin WebSocket Diagnostic Client (https://192.168.28.132:5000)</title>
  <style>
    /* Styling with an orange theme to visually distinguish the external origin (port 5000) from the chat app (port 3000) */
    body { font-family: sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; background: #fff7ed; color: #1e293b; }
    .card { background: #fff; border: 1px solid #fed7aa; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    h2, h3 { margin-top: 0; }
    input, button { padding: 8px 12px; font-size: 14px; border-radius: 4px; border: 1px solid #94a3b8; }
    button { cursor: pointer; background: #ea580c; color: white; border: none; margin-right: 6px; margin-bottom: 6px; }
    button.secondary { background: #475569; }
    #log { height: 260px; overflow-y: auto; border: 1px solid #cbd5e1; padding: 10px; background: #0f172a; color: #e2e8f0; font-family: monospace; font-size: 13px; border-radius: 4px; }
    .log-entry { margin-bottom: 6px; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .info { color: #38bdf8; }
  </style>
</head>
<body>
  <h2>Cross-Origin Diagnostic Client (https://192.168.28.132:5000)</h2>

  <!-- Card 1: Controls to test Cross-Origin WebSocket Handshake and One-Time Ticket Defense -->
  <div class="card">
    <h3>Target WebSocket Endpoint</h3>
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      <input id="targetHost" type="text" value="192.168.28.131:3000" style="flex: 1;" />
    </div>
    <div>
      <button id="testWsBtn">1. Test Cross-Origin WS Handshake (Cookie Only)</button>
      <button id="testTicketFlowBtn">2. Test One-Time Ticket Flow (Fetch Ticket + Connect WS)</button>
      <button id="clearBtn" class="secondary">Clear Log</button>
    </div>
  </div>

  <!-- Card 2: Diagnostic console output showing handshake results -->
  <div class="card">
    <h3>Diagnostic Log</h3>
    <div id="log"></div>
  </div>

  <script>
    // Reference to the diagnostic WebSocket instance
    let testSocket = null;
    // Reference to the on-screen diagnostic log container
    const logEl = document.getElementById('log');

    // Helper function to append a timestamped line to the UI console, browser DevTools console, AND the VM2 server terminal
    function writeLog(text, cls = 'info') {
      const div = document.createElement('div');
      div.className = `log-entry ${cls}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;

      // Also print to the browser DevTools console
      console.log(`[External-Diagnostic] ${text}`);

      // Also send the event to the VM2 server terminal (/api/log) so the terminal window displays live activity
      fetch('/api/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ level: cls.toUpperCase(), message: text })
      }).catch(() => {});
    }

    // Helper function to open a WebSocket to the given URL and log all handshake/message events
    function openDiagnosticSocket(wsUrl) {
      if (testSocket) {
        testSocket.close();
      }

      writeLog(`Initiating cross-origin WebSocket from Origin "${window.location.origin}" -> ${wsUrl}`, 'info');
      testSocket = new WebSocket(wsUrl);

      // Fired ONLY if the server accepts the cross-origin upgrade (Vulnerable Mode)
      testSocket.onopen = () => {
        writeLog('HANDSHAKE ACCEPTED (101 Switching Protocols): Server accepted cross-origin connection.', 'ok');
      };

      // Fired when data frames arrive over an accepted connection
      testSocket.onmessage = (event) => {
        const parsed = JSON.parse(event.data);
        if (parsed.type === 'init') {
          writeLog(`Authenticated session bound to user: ${parsed.user.name} (${parsed.user.email}) | Server mode: ${parsed.mode}`, 'ok');
        } else if (parsed.type === 'message') {
          writeLog(`Stream event received from [${parsed.data.sender}]: ${parsed.data.text}`, 'info');
        }
      };

      // Fired when the server rejects the handshake (e.g., 403 Forbidden due to Origin Validation or Missing Ticket)
      testSocket.onerror = () => {
        writeLog('WebSocket error occurred during handshake.', 'err');
      };

      // Fired when the connection is closed or rejected by the server
      testSocket.onclose = (event) => {
        writeLog(`WebSocket closed (code: ${event.code}) — Connection rejected or terminated by server.`, 'err');
      };
    }

    // Button 1: Initiate a direct cross-origin WebSocket connection (relies on ambient cookies)
    document.getElementById('testWsBtn').addEventListener('click', () => {
      const host = document.getElementById('targetHost').value.trim();
      const wsUrl = `wss://${host}/chat`;
      openDiagnosticSocket(wsUrl);
    });

    // Button 2: Test the One-Time Ticket Flow from an External Origin:
    // Step A: Try to fetch a ticket from POST /api/ws-ticket (Blocked by Browser Same-Origin Policy!)
    // Step B: Try to connect to wss://.../chat without a valid ticket (Rejected by Server Ticket Check!)
    document.getElementById('testTicketFlowBtn').addEventListener('click', async () => {
      const host = document.getElementById('targetHost').value.trim();
      const ticketUrl = `https://${host}/api/ws-ticket`;
      writeLog(`[Step 1/2] Attempting cross-origin POST ${ticketUrl} to obtain a One-Time Ticket...`, 'info');

      let obtainedTicket = null;
      try {
        const res = await fetch(ticketUrl, {
          method: 'POST',
          credentials: 'include'
        });
        const data = await res.json();
        obtainedTicket = data.ticket;
        writeLog(`Unexpectedly read ticket: ${obtainedTicket}`, 'err');
      } catch (err) {
        writeLog(`[Step 1/2 Result] BLOCKED BY SAME-ORIGIN POLICY (CORS): External origin cannot read /api/ws-ticket response (${err.message}).`, 'ok');
      }

      writeLog('[Step 2/2] Attempting WebSocket connection without a valid ticket...', 'info');
      const wsUrl = obtainedTicket
        ? `wss://${host}/chat?ticket=${encodeURIComponent(obtainedTicket)}`
        : `wss://${host}/chat`;
      openDiagnosticSocket(wsUrl);
    });

    // Button 3: Clear the diagnostic log
    document.getElementById('clearBtn').addEventListener('click', () => {
      logEl.innerHTML = '';
    });
  </script>
</body>
</html>
